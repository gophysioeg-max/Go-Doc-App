# Local Postgres 16 with pgvector for the Go Doc knowledge base.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: godoc
      POSTGRES_PASSWORD: godoc
      POSTGRES_DB: godoc_rag
    ports:
      - "5432:5432"
    volumes:
      - godoc_rag_data:/var/lib/postgresql/data
volumes:
  godoc_rag_data:
